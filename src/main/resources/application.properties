#1 - Nombre de la aplicacion
spring.application.name=BalandrauAPI

server.port=8080

#2 - Datos de conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/balandrau_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#3 - JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update


#4 - Literales para los Datos
precioDesayunoString=precioDesayuno
